name: VoidMark Lua regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.1 test runtime
        run: python -m pip install -r tests/requirements.txt
      - name: Validate Lua, assets, startup and regressions
        run: python tests/validate.py
      - name: Validate two-client recent sync
        run: python tests/sync_regressions.py
      - name: Verify installable ZIP matches canonical sources
        run: python tools/package.py --check

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live installer and saved-data preservation
        shell: pwsh
        run: ./tests/install_live_regressions.ps1 -WorkRoot $env:RUNNER_TEMP
