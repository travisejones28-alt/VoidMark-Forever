name: VoidMark Lua regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.1 test runtime
        run: python -m pip install -r tests/requirements.txt
      - name: Validate Lua, assets, startup and regressions
        run: python tests/validate.py
